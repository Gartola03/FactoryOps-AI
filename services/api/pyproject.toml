[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factoryops-api"
version = "0.1.0"
description = "FactoryOps AI FastAPI service"
requires-python = ">=3.11"
authors = [
    { name = "Garikoitz Artola" }
]

dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "coverage>=7.6.0",
    "ruff>=0.14.6",
    "black>=24.4.2",
    "pre-commit>=4.5.0",
    "mypy>=1.19.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["venv", ".git", "build"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
