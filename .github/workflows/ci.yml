name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factoryops
          POSTGRES_PASSWORD: password
          POSTGRES_DB: factoryops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U factoryops -d factoryops"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install API dependencies
        working-directory: services/api
        run: uv sync

      - name: Create database schema
        working-directory: services/api
        env:
          PGPASSWORD: password
        run: |
          psql \
            -h localhost \
            -U factoryops \
            -d factoryops \
            -f app/sql/schema.sql

      - name: Run tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://factoryops:password@localhost:5432/factoryops
        run: uv run pytest

      - name: Run linter
        working-directory: services/api
        run: uv run ruff check .

